<body>
    <div class="container">
        <h1>贪吃蛇游戏</h1>
        <div class="game-info">
            <div class="score">得分: <span id="score">0</span></div>
            <div class="level">等级: <span id="level">1</span></div>
        </div>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div class="controls">
            <button id="startBtn">开始游戏</button>
            <button id="pauseBtn" disabled>暂停游戏</button>
            <button id="resetBtn" disabled>重新开始</button>
        </div>
        <div class="instructions">
            <h3>游戏说明</h3>
            <p>使用方向键控制蛇的移动，空格键暂停/继续游戏</p>
            <p>吃到食物得分，撞到墙壁或自己的身体游戏结束</p>
            <p>随着分数增加，游戏速度会加快</p>
        </div>
    </div>
    <script src="script.js"></script>
